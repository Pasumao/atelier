<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek-V4 × Atelier — AI 原生前端框架演示</title>
    <style>
      /* base reset（token 化的样式变量由 atelier.config.json 注入，见 main.ts） */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
             background: var(--color-bg); color: var(--color-text); line-height: 1.6; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <script>
      // 快照确定性钩子：dev 截图带 ?snapshot=1 时冻结一切动画/过渡，
      // 使逐字节视觉回归稳定（DoD 第 4 条"像素稳定"的前提）
      if (new URLSearchParams(location.search).has("snapshot")) {
        document.documentElement.classList.add("atr-snap");
      }
    </script>
    <style>
      .atr-snap * { animation: none !important; transition: none !important; }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
