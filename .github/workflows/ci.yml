# Atelier CI — P2-4 matrix (BACKLOG).
# Gates: framework vitest · check-skills (single-source discipline) · struct check ·
# api-diff (public API surface drift, P3-4) · init smoke (template → install → app tests).
# The snapshot-smoke job additionally exercises dev-face capture + the P2-2 未检不锚 checkpoint gate,
# but is continue-on-error: visual capture is environment-sensitive and stays a smoke (not a gate) until
# per-platform baselines exist. Never auto-promote — see scripts/snapshot.mjs semantics.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: atelier/pnpm-lock.yaml

      - name: framework unit tests (vitest)
        working-directory: atelier
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: docs numbers gate (README/AGENTS generated counters)
        run: node atelier/scripts/docs-numbers.mjs check

      - name: skills consistency (CLI/MCP/skill single-source)
        run: node atelier/scripts/check-skills.mjs

      - name: M3 grader negative-control (mutations must FAIL)
        run: node atelier/benchmarks/m3/negative-check.mjs

      - name: structure check (starter template app)
        run: node atelier/scripts/struct.mjs check atelier/templates/app

      - name: api surface drift gate (P3-4 — baseline .atelier/api-surface.json)
        run: node atelier/scripts/api-diff.mjs check --root .

      - name: init smoke — scaffold fresh app and run its tests
        shell: bash
        run: |
          node atelier/cli.mjs init --target "$RUNNER_TEMP/smoke-app" --name SmokeApp --no-ai
          cd "$RUNNER_TEMP/smoke-app"
          pnpm install
          pnpm test
  # Dev-face visual smoke (environment-sensitive; continue-on-error smoke, not a gate)
  snapshot-smoke:
    name: snapshot smoke · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: scaffold smoke app
        shell: bash
        run: |
          node atelier/cli.mjs init --target "$RUNNER_TEMP/smoke-app" --name SmokeApp --no-ai
          cd "$RUNNER_TEMP/smoke-app"
          pnpm install

      - name: start dev server (background)
        shell: bash
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          pnpm dev &
          node -e "const t0=Date.now();(async()=>{while(Date.now()-t0<60000){try{await fetch('http://127.0.0.1:5173/');console.log('dev server up');return}catch{}await new Promise(r=>setTimeout(r,500))}throw new Error('dev server never came up')})()"

      - name: install chrome (runner images no longer ship it)
        if: runner.os == 'Linux'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: install chrome system deps (setup-chrome ships the binary only)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: chrome launch sanity
        if: runner.os == 'Linux'
        run: |
          ${{ steps.setup-chrome.outputs.chrome-path }} --version
          ${{ steps.setup-chrome.outputs.chrome-path }} --headless=new --no-sandbox --disable-gpu --dump-dom about:blank | head -2
      - name: snapshot save → check → gated checkpoint anchor
        shell: bash
        working-directory: ${{ runner.temp }}/smoke-app
        env:
          ATELIER_EDGE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          node "$GITHUB_WORKSPACE/atelier/cli.mjs" snapshot save
          node "$GITHUB_WORKSPACE/atelier/cli.mjs" snapshot check
          echo "dirty" >> smoke.txt
          node "$GITHUB_WORKSPACE/atelier/cli.mjs" checkpoint save "ci: baseline anchor (gate MATCH expected)"
