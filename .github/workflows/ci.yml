# Atelier CI — P2-4 matrix (BACKLOG).
# Gates: framework vitest · check-skills (single-source discipline) · struct check ·
# api-diff (public API surface drift, P3-4) · init smoke (template → install → app tests).
# The snapshot-smoke job additionally exercises dev-face capture + the P2-2 未检不锚 checkpoint gate,
# but is continue-on-error: visual capture is environment-sensitive and stays a smoke (not a gate) until
# per-platform baselines exist. Never auto-promote — see scripts/snapshot.mjs semantics.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: atelier/pnpm-lock.yaml

      - name: framework unit tests (vitest)
        working-directory: atelier
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: docs numbers gate (README/AGENTS generated counters)
        run: node atelier/scripts/docs-numbers.mjs check

      - name: skills consistency (CLI/MCP/skill single-source)
        run: node atelier/scripts/check-skills.mjs

      - name: M3 grader negative-control (mutations must FAIL)
        run: node atelier/benchmarks/m3/negative-check.mjs

      - name: structure check (starter template app)
        run: node atelier/scripts/struct.mjs check atelier/templates/app

      - name: api surface drift gate (P3-4 — baseline .atelier/api-surface.json)
        run: node atelier/scripts/api-diff.mjs check --root .

      - name: init smoke — scaffold fresh app and run its tests
        shell: bash
        run: |
          node atelier/cli.mjs init --target "$RUNNER_TEMP/smoke-app" --name SmokeApp --no-ai
          cd "$RUNNER_TEMP/smoke-app"
          pnpm install
          pnpm test
